<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>פרטי רישום - ואהבת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <a href="{{ url_for('index') }}" title="חזרה לעמוד הבית" aria-label="חזרה לעמוד הבית">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ואהבת" class="logo">
    </a>
  </header>

  <main class="container">
    <p class="greeting">ברוך הבא!</p>
    <h2>השלמת פרטים</h2>
    <p class="intro">מסלול נבחר: {{ tiers.get(tier, {}).get('label', tier) }}</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST" action="{{ url_for('details') }}" class="details-form">
      <label for="name">שם מלא</label>
      <input type="text" id="name" name="name" value="{{ name or '' }}" required>

      <label for="email">אימייל</label>
      <input type="email" id="email" name="email" value="{{ email or '' }}" required>

      <label for="marital_status">מצב משפחתי</label>
      <select id="marital_status" name="marital_status" required>
        <option value="" disabled {% if not marital_status %}selected{% endif %}>בחרו</option>
        {% for status in marital_statuses %}
        <option value="{{ status }}" {% if status == marital_status %}selected{% endif %}>{{ status }}</option>
        {% endfor %}
      </select>

      <input type="hidden" name="phone" value="{{ phone }}">
      <input type="hidden" name="tier" value="{{ tier }}">

      <button type="submit">המשך לתשלום <span class="secure-note">(תשלום מאובטח)</span></button>
    </form>
    <a href="{{ url_for('index') }}" class="back-to-site">← חזרה לאתר</a>
  </main>
</body>
</html>
