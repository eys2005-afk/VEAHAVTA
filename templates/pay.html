<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תשלום - ואהבת</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <img src="{{ url_for('static', filename='logo.jpg') }}" alt="ואהבת" class="logo">
  </header>

  <main class="container">
    <p class="intro">{{ tier_label }} - ₪{{ amount }}</p>
    <p id="pay-error" class="error hidden"></p>
    <iframe id="nedarim-frame" class="nedarim-frame" src="https://matara.pro/nedarimplus/iframe/?language=he"></iframe>
  </main>

  <script>
    // NOTE: this postMessage handshake is reconstructed from patterns seen
    // in several other live Nedarim Plus integrations, not from official
    // documentation - it has NOT been tested against this client's real
    // Mosad ID yet (unlike the plain redirect form in nedarim.py, which
    // has). Verify this actually loads/charges correctly once deployed.
    const frame = document.getElementById('nedarim-frame');
    const errorBox = document.getElementById('pay-error');
    const config = {{ nedarim_params | tojson }};

    function postToNedarim(message) {
      frame.contentWindow.postMessage(JSON.stringify(message), 'https://matara.pro');
    }

    frame.addEventListener('load', function () {
      postToNedarim({ Name: 'Set', Value: config });
    });

    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://matara.pro') return;

      let data = event.data;
      try {
        data = JSON.parse(data);
      } catch (err) {
        // Some messages (e.g. height updates) may already be plain numbers/objects.
      }

      if (data && data.Height) {
        frame.style.height = data.Height + 'px';
      }
    });
  </script>
</body>
</html>
