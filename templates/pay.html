<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>תשלום - ואהבת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <img src="{{ url_for('static', filename='logo.png') }}" alt="ואהבת" class="logo">
  </header>

  <main class="container">
    {% if returning %}
    <p class="greeting">כיף שהגעת שוב!</p>
    {% endif %}
    <p class="intro">{{ tier_label }} - ₪{{ amount }}</p>
    <p id="pay-loading" class="intro">טוען טופס תשלום מאובטח…</p>
    <p id="pay-error" class="error hidden"></p>
    <iframe id="nedarim-frame" class="nedarim-frame" src="https://matara.pro/nedarimplus/iframe?language=he"></iframe>
  </main>

  <script>
    // Implements Nedarim Plus's official iframe protocol (per their PDF
    // integration guide), not a guess:
    //   1. iframe loads -> we ask it for its height ({Name: 'GetHeight'}).
    //   2. it replies {Name: 'Height', Value: <px>} -> we resize the iframe.
    //   3. we send the transaction details ({Name: 'FinishTransaction2',
    //      Value: {...}}) so the iframe can show its own card form and
    //      complete the charge.
    //   4. it replies {Name: 'TransactionResponse', Value: {Status, ...}}.
    // Messages are sent as raw objects via postMessage (NOT JSON.stringify),
    // matching Nedarim Plus's own sample code.
    const frame = document.getElementById('nedarim-frame');
    const loadingBox = document.getElementById('pay-loading');
    const errorBox = document.getElementById('pay-error');
    const transaction = {{ transaction | tojson }};
    let formReady = false;

    function postToNedarim(data) {
      frame.contentWindow.postMessage(data, '*');
    }

    frame.addEventListener('load', function () {
      postToNedarim({ Name: 'GetHeight' });
      postToNedarim({ Name: 'FinishTransaction2', Value: transaction });
    });

    window.addEventListener('message', function (event) {
      if (event.origin !== 'https://matara.pro') return;

      const message = event.data;
      if (!message || !message.Name) return;

      if (message.Name === 'Height') {
        formReady = true;
        loadingBox.classList.add('hidden');
        frame.style.height = (parseInt(message.Value, 10) + 15) + 'px';
      } else if (message.Name === 'TransactionResponse') {
        if (message.Value && message.Value.Status === 'Error') {
          errorBox.textContent = message.Value.Message || 'שגיאה בתשלום, נסו שוב';
          errorBox.classList.remove('hidden');
        }
      }
    });

    // The iframe form itself renders Nedarim Plus's card fields + charge
    // button once it accepts FinishTransaction2 - if that handshake never
    // completes (e.g. a misconfigured/missing NEDARIM_API_VALID), the user
    // would otherwise just see a blank area with no explanation.
    setTimeout(function () {
      if (!formReady) {
        loadingBox.classList.add('hidden');
        errorBox.textContent = 'טופס התשלום לא נטען כראוי. נסו לרענן את הדף, ואם הבעיה נמשכת פנו אלינו.';
        errorBox.classList.remove('hidden');
      }
    }, 8000);
  </script>
</body>
</html>
