<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>נרשמת - ואהבת</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="header">
    <a href="{{ url_for('index') }}" title="חזרה לעמוד הבית" aria-label="חזרה לעמוד הבית">
      <img src="{{ url_for('static', filename='logo.png') }}" alt="ואהבת" class="logo">
    </a>
  </header>

  <main class="container">
    <p class="greeting">✓ נרשמת!</p>
    <p class="intro">{{ tier_label }}</p>

    {% if free %}
      {% if opening_promo %}
      <p class="intro">🎉 חודש פתיחה חינם! (המחיר הרגיל ₪{{ real_amount }})</p>
      {% else %}
      <p class="intro">הפעם זה חינם - תיהנו!</p>
      {% endif %}
    {% else %}
    <p class="intro">נשארו לך {{ entries_remaining }} כניסות</p>
    {% endif %}

    <a href="{{ url_for('index') }}" class="back-to-site">← חזרה לאתר</a>
  </main>
</body>
</html>
